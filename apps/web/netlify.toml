[build]
  command = "pnpm --filter @thoughtline/web build"
  publish = "/apps/web/dist/client"
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- apps/web package.json pnpm-lock.yaml pnpm-workspace.yaml"

[build.environment]
  NODE_VERSION = "24"
  PNPM_VERSION = "11.7.0"

[dev]
  command = "pnpm --filter @thoughtline/web dev"
  targetPort = 3000
  port = 8888
